name: Folio builds

# Builds the Folio apps on the platforms that can package them:
# Windows installers (.msi, .exe) and a portable zip, plus the Android APK.
on:
  push:
    paths:
      - "folio/**"
      - ".github/workflows/folio-builds.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows (MSI, EXE, portable zip)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: folio
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew :composeApp:desktopTest --no-daemon
      - name: Package installers
        run: ./gradlew :composeApp:packageMsi :composeApp:packageExe :composeApp:createDistributable --no-daemon
      - name: Zip the portable app
        shell: pwsh
        run: Compress-Archive -Path composeApp/build/compose/binaries/main/app/Folio -DestinationPath composeApp/build/Folio-windows-portable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Folio-windows
          path: |
            folio/composeApp/build/compose/binaries/main/msi/*.msi
            folio/composeApp/build/compose/binaries/main/exe/*.exe
            folio/composeApp/build/Folio-windows-portable.zip
          if-no-files-found: error

  android:
    name: Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: folio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release APK
        run: ./gradlew :composeApp:assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Folio-android
          path: folio/composeApp/build/outputs/apk/release/*.apk
          if-no-files-found: error
